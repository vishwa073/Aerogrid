# ==========================================
# AeroGrid Local Orchestration
# ==========================================
# To start all services:
#   docker compose up --build
#
# Access services at:
#   Frontend: http://localhost:3000
#   Backend API: http://localhost:8000/api/v1/docs
#   Health Check: http://localhost:8000/health

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aerogrid-backend
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=AeroGrid
      - API_V1_STR=/api/v1
      - ENVIRONMENT=development
      - DEBUG=true
      - BACKEND_CORS_ORIGINS=http://localhost:3000,http://localhost:5173
      - ELEXON_API_BASE_URL=https://data.elexon.co.uk/bmrs/api/v1
      - DEFAULT_DECISION_CUTOFF_TIME=11:00
      - DATABASE_URL=${DATABASE_URL}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aerogrid-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: aerogrid-network
